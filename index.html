<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Solih</title>
  <meta name="theme-color" content="#0B0D17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solih">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Kiriş -->
  <section id="screen-login" class="screen login hidden">
    <div class="login-box">
      <div class="logo">S</div>
      <h1><em>Solih</em></h1>
      <p class="muted">Kiriş uçun parolingizni yozing</p>
      <form id="loginForm">
        <input id="password" type="password" autocomplete="current-password" placeholder="Parol" required>
        <button type="submit" id="loginBtn" class="btn-accent">Kiriş</button>
      </form>
      <p id="loginErr" class="err hidden"></p>
    </div>
    <div id="installHint" class="install hidden">
      <b>Ilova qilib örnatiş</b>
      <span>Safari'da <b>•••</b> → <b>Поделиться</b> → <b>На экран «Домой»</b></span>
    </div>
  </section>

  <!-- Bosh ekran -->
  <section id="screen-home" class="screen hidden">
    <header class="bar">
      <span class="brand">Solih</span>
      <button id="logoutBtn" class="icon-btn hidden" aria-label="Çiqiş">
        <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
      </button>
    </header>

    <div class="hello">
      <p id="greet" class="muted"></p>
      <h1 id="today"></h1>
    </div>

    <button id="summary" class="summary">
      <div class="summary-top">
        <span>Bugungi vazifalar</span>
        <span id="sumCount" class="count">—</span>
      </div>
      <div class="progress"><i id="sumBar"></i></div>
      <p id="sumNext" class="next">Yuklanmoqda…</p>
    </button>

    <h2 class="section">Agentlar</h2>
    <div id="modules" class="modules"></div>

    <div id="pushBox" class="install push-box hidden">
      <b>🔔 Bildirişlar</b>
      <span id="pushState">Eslatmalar telefon ekraniga ham kelsin.</span>
      <button id="pushBtn" class="btn-accent hidden">Bildirişlarni yoqiş</button>
      <button id="pushTestBtn" class="btn-ghost hidden">Sinov bildirişi</button>
    </div>

    <div id="installHint2" class="install hidden">
      <b>Ilova qilib örnatiş</b>
      <span>Safari'da <b>•••</b> → <b>Поделиться</b> → <b>На экран «Домой»</b></span>
    </div>
  </section>

  <!-- Rejalaştiruvçi -->
  <section id="screen-planner" class="screen hidden">
    <header class="bar">
      <button id="backBtn" class="icon-btn" aria-label="Orqaga">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="title">Rejalaştiruvçi</span>
      <button id="refreshBtn" class="icon-btn" aria-label="Yangilaş">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
      </button>
    </header>
    <div class="tabs" role="tablist">
      <button class="tab active" data-view="day">Bugun</button>
      <button class="tab" data-view="tomorrow">Ertaga</button>
      <button class="tab" data-view="week">Hafta</button>
    </div>
    <main id="list" class="list"></main>
    <button id="micFab" class="fab fab-mic" aria-label="Ovoz bilan qöşiş">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button id="addBtn" class="fab" aria-label="Vazifa qöşiş">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </section>

  <!-- Vazifa qöşiş oynasi -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-card">
      <div class="sheet-head">
        <b>Yangi vazifa</b>
        <button id="closeSheet" class="icon-btn" aria-label="Yopiş">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div id="stepText">
        <textarea id="taskText" rows="2" placeholder="Masalan: ertaga 15:00 dökonga boriş, 1 soat"></textarea>
        <button id="micBtn" class="btn-mic" type="button">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span id="micLabel">Gapirib aytiş</span>
        </button>
        <button id="parseBtn" class="btn-accent">Davom etiş</button>
        <button id="manualBtn" class="btn-ghost">Qölda töldiriş</button>
      </div>

      <div id="routineBox" class="routine hidden">
        <p id="routineText"></p>
        <button id="rOnce" class="btn-accent" type="button">Ha, faqat şu kun</button>
        <button id="rWeek" class="btn-ghost" type="button">Har hafta şunday</button>
        <button id="rTask" class="btn-ghost" type="button">Yöq, alohida vazifa</button>
      </div>

      <form id="stepForm" class="hidden">
        <label>Nomi<input id="fTitle" required maxlength="100"></label>
        <div class="row">
          <label>Sana<input id="fDate" type="date" required></label>
          <label>Vaqt<input id="fStart" type="time" required></label>
        </div>
        <div class="row">
          <label>Davomiylik
            <select id="fDuration">
              <option value="15">15 daq</option><option value="30">30 daq</option>
              <option value="45">45 daq</option><option value="60">1 soat</option>
              <option value="90">1,5 soat</option><option value="120">2 soat</option>
              <option value="180">3 soat</option>
            </select>
          </label>
          <label>Muhimlik
            <select id="fPriority"><option>Yuqori</option><option selected>Örta</option><option>Past</option></select>
          </label>
        </div>
        <label>Kategoriya
          <select id="fCategory">
            <option>Öqiş</option><option>Iş</option><option>Dökon</option>
            <option>Sport</option><option>Şaxsiy</option><option selected>Boşqa</option>
          </select>
        </label>
        <label>Izoh<input id="fNote" maxlength="200" placeholder="ixtiyoriy"></label>
        <p id="formWarn" class="warn hidden"></p>
        <button type="submit" id="saveBtn" class="btn-accent">Saqlaş</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
